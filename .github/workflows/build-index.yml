name: Build skill index

# Whenever a skill Markdown file changes on the main branch, regenerate
# skills.json so contributors only ever have to add/edit one Markdown file.

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate skills.json
        run: node scripts/build-index.mjs

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet skills.json; then
            git add skills.json
            git commit -m "chore: rebuild skill index [skip ci]"
            git push
          else
            echo "skills.json already up to date."
          fi
