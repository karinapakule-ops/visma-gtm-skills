name: Build skill data

# Whenever a skill Markdown file changes on the main branch, regenerate the
# data the website loads so contributors only ever have to add/edit one
# Markdown file in /skills — no local build step required.
#
# Generates BOTH:
#   - assets/js/skills-data.js  (window.SKILLS — the file the website loads)
#   - skills.json               (legacy index, kept in sync)

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate skill data
        run: |
          node scripts/build-data.mjs
          node scripts/build-index.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/js/skills-data.js skills.json; then
            git add assets/js/skills-data.js skills.json
            git commit -m "chore: rebuild skill data [skip ci]"
            git push
          else
            echo "Skill data already up to date."
          fi
